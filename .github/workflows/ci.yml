name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reference-specs:
    name: TypeScript reference specs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci

      - name: Typecheck, spec consistency, and tests
        run: npm run check

  rust-parity:
    name: Rust parity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests and parity vectors
        run: cargo test --workspace --all-targets --locked

  anchor-build:
    name: Anchor SBF + IDL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: quay.io/ottersec/anchor:v1.2.1

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Verify pinned Anchor and Solana CLIs
        shell: bash
        run: |
          set -euo pipefail
          anchor --version | tee /tmp/anchor-version
          solana --version | tee /tmp/solana-version
          rustc --version
          grep -F "anchor-cli 1.2.1" /tmp/anchor-version
          grep -F "solana-cli 4.1.2" /tmp/solana-version

      - name: Build SBF program and IDL from clean checkout
        shell: bash
        run: anchor build --ignore-keys

      - name: Assert required build artifacts and settlement IDL surface
        shell: bash
        run: |
          set -euo pipefail
          test -s target/deploy/royaltyrail.so
          test -s target/idl/royaltyrail.json
          grep -q 'initialize_royalty_inbox' target/idl/royaltyrail.json
          grep -q 'fund_and_allocate' target/idl/royaltyrail.json
          grep -q 'allocate_inbox' target/idl/royaltyrail.json
          grep -q 'claim_participant' target/idl/royaltyrail.json
