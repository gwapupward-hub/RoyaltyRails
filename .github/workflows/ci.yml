name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reference-specs:
    name: TypeScript reference specs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci

      - name: Typecheck, spec consistency, and tests
        run: npm run check

      - name: Verify Phase 3E identity against frozen manifest (keyless)
        run: node scripts/phase3e/verify-identity.mjs

      - name: Syntax-check keyless Phase 3E RPC and metadata PDA tools
        run: |
          node --check scripts/phase3e/devnet-preflight.mjs
          node --check scripts/phase3e/verify-pdas.mjs

  rust-parity:
    name: Rust parity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-24
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests and parity vectors
        run: cargo test --workspace --all-targets --locked

  anchor-build:
    name: Anchor SBF + IDL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: quay.io/ottersec/anchor:v1.2.1@sha256:23f988d1b817160b5514faa19bc50e77d41c4ff9aeccce94c9856696e20f8fed

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          # Full history: the frozen devnet manifest is compared with its source commit.
          fetch-depth: 0

      - name: Verify pinned Anchor and Solana CLIs
        shell: bash
        run: |
          set -euo pipefail
          anchor --version | tee /tmp/anchor-version
          solana --version | tee /tmp/solana-version
          rustc --version
          grep -F "anchor-cli 1.2.1" /tmp/anchor-version
          grep -F "solana-cli 4.1.2" /tmp/solana-version

      - name: Build SBF program and IDL from clean checkout
        shell: bash
        run: anchor build --ignore-keys

      - name: Assert required build artifacts and settlement IDL surface
        shell: bash
        run: |
          set -euo pipefail
          test -s target/deploy/royaltyrail.so
          test -s target/idl/royaltyrail.json
          grep -q 'initialize_royalty_inbox' target/idl/royaltyrail.json
          grep -q 'fund_and_allocate' target/idl/royaltyrail.json
          grep -q 'allocate_inbox' target/idl/royaltyrail.json
          grep -q 'claim_participant' target/idl/royaltyrail.json

      - name: Verify one program ID across declare_id!, IDL, binary, Anchor.toml, and devnet authorities
        shell: bash
        run: |
          set -euo pipefail
          args=(--so target/deploy/royaltyrail.so --idl target/idl/royaltyrail.json
                --source programs/royaltyrail/src/lib.rs --anchor-toml Anchor.toml)
          if [ -f deployments/devnet/authorities.json ]; then
            args+=(--authorities deployments/devnet/authorities.json)
          fi
          node scripts/devnet/program-id.mjs check "${args[@]}"

      # The deployable artifact: devnet deployments use these exact bytes, and the
      # devnet lifecycle compares on-chain ProgramData against them.
      - name: Record build hashes and source commit
        id: build-info
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifact
          cp target/deploy/royaltyrail.so target/idl/royaltyrail.json build-artifact/
          git -c safe.directory='*' rev-parse HEAD > build-artifact/SOURCE_COMMIT
          # The checkout follows the branch head, which can be newer than the
          # triggering commit; name the artifact after what was actually built.
          echo "commit=$(cat build-artifact/SOURCE_COMMIT)" >> "$GITHUB_OUTPUT"
          {
            anchor --version
            solana --version
            rustc --version
            echo "declare_id: $(grep -o 'declare_id!("[^"]*")' programs/royaltyrail/src/lib.rs)"
          } > build-artifact/BUILD_INFO
          (cd build-artifact && sha256sum royaltyrail.so royaltyrail.json > SHA256SUMS)
          cat build-artifact/SOURCE_COMMIT build-artifact/BUILD_INFO build-artifact/SHA256SUMS
          stat -c '%n %s bytes' build-artifact/royaltyrail.so
          RR_BUILD_CONTAINER=quay.io/ottersec/anchor:v1.2.1 node scripts/devnet/manifest.mjs create \
            --artifact-dir build-artifact --out build-artifact/MANIFEST.json \
            --authorities deployments/devnet/authorities.json

      # Once a devnet manifest is frozen, every later build of the same program sources
      # must reproduce its hashes exactly.
      - name: Verify the frozen devnet manifest reproduces
        shell: bash
        run: |
          set -euo pipefail
          if [ -f deployments/devnet/manifest.json ]; then
            node scripts/devnet/manifest.mjs verify-frozen \
              --frozen deployments/devnet/manifest.json --artifact-dir build-artifact
          else
            echo "no frozen devnet manifest yet"
          fi

      - name: Verify exact frozen Phase 3E IDL and SBF before uploading artifact
        shell: bash
        run: node scripts/phase3e/verify-identity.mjs --idl target/idl/royaltyrail.json --so target/deploy/royaltyrail.so

      - name: Upload deployable program artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: royaltyrail-sbf-${{ steps.build-info.outputs.commit }}
          path: build-artifact/
          if-no-files-found: error

  localnet-e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Each suite needs its own fresh validator ledger: ProtocolConfig is a
    # per-deployment singleton and the adversarial matrix tests its initialization.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Local validator positive lifecycle
            script: test
          - name: Local validator adversarial matrix
            script: test-adversarial
          - name: Local validator devnet-lifecycle rehearsal
            script: test-devnet-rehearsal
    container:
      image: quay.io/ottersec/anchor:v1.2.1@sha256:23f988d1b817160b5514faa19bc50e77d41c4ff9aeccce94c9856696e20f8fed
      # Agave 4.1.2 asserts io_uring support at startup; Docker's default
      # seccomp profile blocks the io_uring syscalls inside job containers.
      options: --security-opt seccomp=unconfined

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install reference and pinned E2E client dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          # Integrity-locked client libraries, installed as in the owner's Codespace.
          npm ci --prefix tests/e2e --ignore-scripts
          test "$(node -p "require('./tests/e2e/node_modules/@anchor-lang/core/package.json').version")" = "1.2.1"
          test "$(node -p "require('./tests/e2e/node_modules/@solana/web3.js/package.json').version")" = "1.99.0"
          test "$(node -p "require('./tests/e2e/node_modules/@solana/spl-token/package.json').version")" = "0.4.15"
          # The devnet lifecycle cross-checks against the compiled TypeScript reference.
          npm run build

      - name: Verify expected canonical PMP metadata addresses (keyless)
        shell: bash
        run: node scripts/phase3e/verify-pdas.mjs

      - name: Create disposable localnet wallet and program identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana" target/deploy
          solana-keygen new --no-bip39-passphrase --silent --force \
            -o "$HOME/.config/solana/id.json"
          solana-keygen new --no-bip39-passphrase --silent --force \
            -o target/deploy/royaltyrail-keypair.json
          anchor keys sync
          test -s target/deploy/royaltyrail-keypair.json

      - name: Build program with disposable synced localnet identity
        shell: bash
        run: anchor build

      - name: Run Anchor.toml script "${{ matrix.script }}" against solana-test-validator
        shell: bash
        run: |
          set +e
          anchor test --validator legacy --skip-build --script "${{ matrix.script }}"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- Anchor validator wrapper log ---"
            cat .anchor/test-ledger/test-ledger-log.txt 2>/dev/null || true
            echo "--- solana-test-validator validator.log ---"
            cat .anchor/test-ledger/validator.log 2>/dev/null || true
            echo "--- RoyaltyRail program log ---"
            cat .anchor/program-logs/*.log 2>/dev/null || true
          fi
          exit "$status"

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-evidence-${{ matrix.script }}
          path: target/e2e/
          if-no-files-found: ignore
