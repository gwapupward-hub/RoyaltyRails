name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reference-specs:
    name: TypeScript reference specs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate reproducible lockfile candidate
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-candidate
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies
        run: npm install

      - name: Typecheck, spec consistency, and tests
        run: npm run check
