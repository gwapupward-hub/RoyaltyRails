name: Phase 3C lockfile refresh

on:
  push:
    branches:
      - feat/phase-3c-settlement-v1

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'gwapupward-hub/RoyaltyRails'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Phase 3C branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase-3c-settlement-v1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Verify only Cargo.lock changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          if [[ "$changed" != "Cargo.lock" ]]; then
            echo "Unexpected generated changes:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit Cargo.lock when needed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh Cargo lockfile for Anchor SPL"
          git push origin HEAD:feat/phase-3c-settlement-v1
