name: SoundReceipt foundation (non-production)

on:
  pull_request:
    paths:
      - "apps/soundreceipt/**"
      - ".github/workflows/soundreceipt-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_DB: soundreceipt_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soundreceipt_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: soundreceipt_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Lint OpenAPI 3.1 and resolve references
        run: npx --yes @redocly/cli@2.69.0 lint apps/soundreceipt/openapi.yaml --config apps/soundreceipt/redocly.yaml
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply foundation migration in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f apps/soundreceipt/db/migrations/0001_initial.sql
      - name: Assert tenant foreign keys and fail-closed RLS using unprivileged role
        run: psql -X -v ON_ERROR_STOP=1 -f apps/soundreceipt/tests/foundation.sql
