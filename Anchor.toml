[toolchain]
anchor_version = "1.2.1"
solana_version = "4.1.2"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
royaltyrail = "ErqjTNhQWyLCjJZpFg9jyGAgWJS7KYLN5kFUiNf3KYdH"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
startup_wait = 90000
# Load the program as upgradeable with the provider wallet as upgrade authority,
# which initialize_config requires as a co-signer.
upgradeable = true

[scripts]
test = "node tests/e2e/positive-lifecycle.mjs"
test-adversarial = "node tests/e2e/adversarial-matrix.mjs"
# Two runs on one validator: the first initializes ProtocolConfig, the second reuses it (as on devnet).
test-devnet-rehearsal = "node tests/e2e/devnet-lifecycle.mjs && node tests/e2e/devnet-lifecycle.mjs"
