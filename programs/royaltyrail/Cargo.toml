[package]
name = "royaltyrail"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "royaltyrail"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# Anchor SPL 1.2.1's IDL builder references token_interface types behind its
# token_2022 feature. Enable that feature only for IDL generation; the runtime
# program continues to use anchor_spl::token and the original SPL Token Program.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))',
  'cfg(target_os, values("solana"))',
] }

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
royaltyrail-core.workspace = true
