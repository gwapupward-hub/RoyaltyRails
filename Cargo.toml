[workspace]
members = [
  "crates/royaltyrail-core",
  "programs/royaltyrail",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
anchor-lang = "=1.2.1"
anchor-spl = { version = "=1.2.1", default-features = false, features = ["solana-v3", "associated_token", "token"] }
royaltyrail-core = { path = "crates/royaltyrail-core" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
